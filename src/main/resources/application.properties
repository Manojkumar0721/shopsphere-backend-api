# Application Name
spring.application.name=shopsphere-api

# Server Configuration
server.port=8080

# Import local properties (application-local.properties is in .gitignore)
spring.config.import=optional:classpath:application-local.properties

# Database Configuration (MySQL 8)
# Reads from environment variables if present, otherwise uses local defaults.
# Password is loaded from application-local.properties or DB_PASSWORD env var.
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/shopsphere_db?createDatabaseIfNotExist=true&useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# HikariCP Connection Pool Settings
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=5
spring.datasource.hikari.idle-timeout=300000
spring.datasource.hikari.connection-timeout=20000

# JPA & Hibernate Configuration
# 'update': automatically creates or updates tables based on JPA entities
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

# Open-Session-In-View (OSIV): Set to false to prevent database connection leakage into the web layer
spring.jpa.open-in-view=false

# Logging Configuration
logging.level.root=INFO
logging.level.com.shopsphere=DEBUG
logging.level.org.hibernate.SQL=DEBUG
logging.level.org.hibernate.orm.jdbc.bind=TRACE
